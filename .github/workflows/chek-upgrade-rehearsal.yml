name: CHEK Upgrade Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/chek-upgrade-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-schema-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: multica_upgrade
          POSTGRES_USER: multica
          POSTGRES_PASSWORD: multica
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U multica -d multica_upgrade"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://multica:multica@localhost:5432/multica_upgrade?sslmode=disable
      BASELINE_SHA: e55ab91e0e91f6f1356e76f774b357377def8e5e
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '~1.26.10'
          cache-dependency-path: server/go.sum
      - name: Build the deployed CHEK schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/deployed-multica"
          git archive "${BASELINE_SHA}" server | tar -x -C "${RUNNER_TEMP}/deployed-multica"
          cd "${RUNNER_TEMP}/deployed-multica/server"
          go run ./cmd/migrate up
      - name: Seed synthetic CHEK audit records
        shell: bash
        run: |
          set -euo pipefail
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO company_codex_key (workspace_id,user_id,gateway_key_id,gateway_key_prefix)
          VALUES ('00000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000002','rehearsal-key','test');
          INSERT INTO company_codex_session (id,workspace_id,user_id,gateway_key_id,client_session_id)
          VALUES ('00000000-0000-0000-0000-000000000003','00000000-0000-0000-0000-000000000001','00000000-0000-0000-0000-000000000002','rehearsal-key','rehearsal-session');
          INSERT INTO company_codex_turn (session_id,request_id,prompt,response,input_tokens,output_tokens)
          VALUES ('00000000-0000-0000-0000-000000000003','rehearsal-request','synthetic prompt','synthetic response',17,23);
          SQL
      - name: Upgrade and verify repeatability
        working-directory: server
        shell: bash
        run: |
          set -euo pipefail
          go run ./cmd/migrate up
          go run ./cmd/migrate up
          python3 - <<'PY' > "${RUNNER_TEMP}/expected-migrations"
          from pathlib import Path
          print('\n'.join(sorted(p.name.removesuffix('.up.sql') for p in Path('migrations').glob('*.up.sql'))))
          PY
          psql "${DATABASE_URL}" -Atqc 'SELECT version FROM schema_migrations ORDER BY version' > "${RUNNER_TEMP}/actual-migrations"
          diff -u "${RUNNER_TEMP}/expected-migrations" "${RUNNER_TEMP}/actual-migrations"
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF (SELECT count(*) FROM company_codex_key WHERE gateway_key_id='rehearsal-key') <> 1
              OR (SELECT count(*) FROM company_codex_session WHERE client_session_id='rehearsal-session') <> 1
              OR (SELECT count(*) FROM company_codex_turn WHERE request_id='rehearsal-request' AND input_tokens=17 AND output_tokens=23 AND response='synthetic response') <> 1
            THEN RAISE EXCEPTION 'CHEK audit records changed during upgrade'; END IF;
            IF EXISTS (SELECT 1 FROM pg_index WHERE NOT indisvalid)
            THEN RAISE EXCEPTION 'invalid index remains after upgrade'; END IF;
          END $$;
          SQL
