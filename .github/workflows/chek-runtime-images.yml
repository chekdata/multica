name: CHEK Runtime Images

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile*'
      - 'server/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/chek-runtime-images.yml'
      - '.github/workflows/chek-prod-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chek-runtime-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: Dockerfile
          - image: web
            dockerfile: Dockerfile.web
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Build production runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          platforms: linux/amd64
          push: false
          load: true
          tags: multica-${{ matrix.image }}:ci
          cache-from: type=gha,scope=chek-verify-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=chek-verify-${{ matrix.image }}
      - name: Report runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: multica-${{ matrix.image }}:ci
          scanners: vuln
          format: json
          output: trivy-${{ matrix.image }}.json
      - name: Save vulnerability report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-vulnerabilities-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.json
          if-no-files-found: error
      - name: Reject fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: multica-${{ matrix.image }}:ci
          scanners: vuln
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true
